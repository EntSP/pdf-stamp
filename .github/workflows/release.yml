# Release for pdf-stamp — https://github.com/EntSP/pdf-stamp
#
# One release publishes one binary per platform, all six from GitHub-hosted
# runners, each with a `.sha256` beside it:
#
#   pdf-stamp-linux-x86_64          Linux, Scriptor's runtime image included
#   pdf-stamp-linux-aarch64         Linux on ARM64
#   pdf-stamp-windows-x86_64.exe    Windows
#   pdf-stamp-windows-aarch64.exe   Windows on ARM64
#   pdf-stamp-macos-aarch64         Apple Silicon
#   pdf-stamp-macos-x86_64          Intel Macs
#
# The Linux ones are musl and static, so they run in a `FROM scratch` image
# as readily as on any distribution; the Windows ones carry their C
# runtime.
#
# Each binary also gets a GitHub build-provenance attestation, which ties
# it to the commit and the workflow run that built it. GitHub keeps it,
# and the release carries a copy beside the binary, <asset>.sigstore.json.
# Check a download against either:
#
#   gh attestation verify pdf-stamp-linux-x86_64 --repo EntSP/pdf-stamp
#   gh attestation verify pdf-stamp-linux-x86_64 --repo EntSP/pdf-stamp \
#       --bundle pdf-stamp-linux-x86_64.sigstore.json
#
# ## How a release happens
#
# Cargo.toml's version is the release. A push to main that changes
# Cargo.toml runs this workflow, and when no tag names that version yet it
# checks the commit, builds every binary, publishes the crate to crates.io,
# and then creates the GitHub release, and the tag with it, on that commit.
# A version a tag already names does nothing; one older than the newest
# tag fails the run (.github/scripts/release_version.py says why). "Run
# workflow" does the same on demand, to retry a release that failed. A
# version with a pre-release part, 0.2.0-rc.1, makes a pre-release, so
# `releases/latest` stays on the last full release.
#
# crates.io takes the crate through trusted publishing, so no token is
# stored here: the crate's settings on crates.io name this repository and
# release.yml, and can name the `release` environment the publish job runs
# in, as allowed to publish it. Those settings exist only once the crate
# does, so its first version on crates.io is published by hand; a run that
# finds its version there already skips that step.

name: Release

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time: two runs deciding at once could both find the
# version untagged.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Whether this push is a release, and of which version. Everything below
  # runs only when it is.
  # ────────────────────────────────────────────────────────────────────
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Only main releases
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::${GITHUB_REF} is not main, and only main is released." >&2
          exit 1

      - uses: actions/checkout@v5

      - name: Cargo.toml's version, and whether a tag names it yet
        id: version
        run: python3 -I .github/scripts/release_version.py .

  # ────────────────────────────────────────────────────────────────────
  # Nothing is published until this passes. Same check.sh ci.yml runs, so
  # a release cannot hold a build the ordinary gate would have rejected.
  # ────────────────────────────────────────────────────────────────────
  check:
    name: Check
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: check.sh
        run: bash .github/scripts/check.sh

  # ────────────────────────────────────────────────────────────────────
  # The binary, per platform. One matrix, five runner images, one release.
  # ────────────────────────────────────────────────────────────────────
  build:
    name: ${{ matrix.slug }}
    needs: [version, check]
    runs-on: ${{ matrix.os }}
    # Signing and recording the attestation. Publishing is the job after.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl and statically linked, so each Linux binary runs on any
          # distribution and in a scratch image. Nothing in the tree is C
          # (`cargo tree -i cc` finds nothing), so neither needs a musl C
          # compiler. The ARM64 one is built natively, on GitHub's ARM
          # runner.
          - { slug: linux-x86_64,   os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  exe: "" }
          - { slug: linux-aarch64,  os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, exe: "" }
          - { slug: windows-x86_64, os: windows-latest,   target: x86_64-pc-windows-msvc,     exe: ".exe" }
          # Windows on ARM64, built natively on GitHub's ARM runner. Nothing
          # in the tree is C, so no ARM64 C toolchain is involved.
          - { slug: windows-aarch64, os: windows-11-arm, target: aarch64-pc-windows-msvc, exe: ".exe" }
          # macos-latest is Apple Silicon, and x86_64-apple-darwin
          # cross-compiles from it because Xcode ships both slices of the
          # SDK.
          - { slug: macos-aarch64,  os: macos-latest,     target: aarch64-apple-darwin,       exe: "" }
          - { slug: macos-x86_64,   os: macos-latest,     target: x86_64-apple-darwin,        exe: "" }

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.slug }}

      - name: Build
        shell: bash
        run: |
          set -eu
          case "${{ matrix.target }}" in
            *-unknown-linux-musl | *-pc-windows-msvc)
              # The C runtime linked in: no libc to match on Linux, and no
              # Visual C++ Redistributable needed on Windows.
              export RUSTFLAGS="-C target-feature=+crt-static"
              ;;
          esac
          cargo build --locked --release --target "${{ matrix.target }}" --bin pdf-stamp

      - name: Name it for the platform
        shell: bash
        run: |
          set -eu
          asset="pdf-stamp-${{ matrix.slug }}${{ matrix.exe }}"
          cp "target/${{ matrix.target }}/release/pdf-stamp${{ matrix.exe }}" "$asset"

          # No pipeline. `set -e` does not fire on a non-final command in
          # one, so a hasher that failed would leave an EMPTY .sha256 and
          # this step would report success. The asset is already named for
          # the platform, so neither hasher needs its output rewritten.
          # sha256sum on Linux and Git Bash, shasum on macOS.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          # The step checks its own work: a published checksum that does
          # not check out is worse than none, because a consumer that
          # verifies refuses the release and one that does not never
          # finds out.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "$asset.sha256"
          else
            shasum -a 256 -c "$asset.sha256"
          fi
          echo "--- $asset: $(wc -c < "$asset") bytes"

      # What the Windows build flags are for. An import of vcruntime140.dll
      # would mean the Visual C++ Redistributable is needed after all, and
      # the step after this would not notice: the runner has it installed.
      - name: It needs no Visual C++ runtime
        if: matrix.exe == '.exe'
        shell: bash
        run: |
          set -eu
          asset="pdf-stamp-${{ matrix.slug }}${{ matrix.exe }}"
          if grep -a -q -i 'vcruntime140' "$asset"; then
            echo "::error::$asset imports the Visual C++ runtime (vcruntime140.dll)" >&2
            exit 1
          fi
          echo "$asset: the C runtime is linked in"

      # musl and +crt-static are what make the Linux build static, and this
      # checks they did: a NEEDED entry or a program interpreter would tie
      # the binary to the libc of the runner that built it, and keep it out
      # of a scratch image.
      - name: It is static
        if: endsWith(matrix.target, '-linux-musl')
        shell: bash
        run: |
          set -eu
          asset="pdf-stamp-${{ matrix.slug }}${{ matrix.exe }}"
          if readelf -d "$asset" | grep NEEDED; then
            echo "::error::$asset links shared libraries" >&2
            exit 1
          fi
          if readelf -l "$asset" | grep -i interpreter; then
            echo "::error::$asset asks for a dynamic loader" >&2
            exit 1
          fi
          echo "$asset: static"

      # A binary that will not start is worse than one that was never built.
      # The asset itself, not the build it was copied from, stamps a page
      # through smoke.sh, as check.sh's build does. Every target but the
      # Intel Mac cross-build can run on the runner that produced it.
      - name: It runs, and it stamps
        if: matrix.slug != 'macos-x86_64'
        shell: bash
        run: |
          set -eu
          asset="./pdf-stamp-${{ matrix.slug }}${{ matrix.exe }}"
          chmod +x "$asset"
          version="$("$asset" --version)"
          echo "$version"
          [ "$version" = "pdf-stamp ${{ needs.version.outputs.version }}" ] || {
            echo "::error::the binary says '${version}', the release is ${{ needs.version.outputs.version }}" >&2; exit 1; }
          bash .github/scripts/smoke.sh "$asset"

      # Signed for this workflow run, so a download can be traced to the
      # commit and the workflow that built it. Of the asset itself, as the
      # .sha256 is: the bytes attested are the bytes published.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: pdf-stamp-${{ matrix.slug }}${{ matrix.exe }}

      # GitHub keeps the attestation; the release carries a copy too, beside
      # the binary, where it can be seen and checked without asking GitHub:
      #   gh attestation verify <asset> --bundle <asset>.sigstore.json --repo EntSP/pdf-stamp
      - name: Keep the attestation with the binary
        shell: bash
        run: cp "${{ steps.attest.outputs.bundle-path }}" "pdf-stamp-${{ matrix.slug }}${{ matrix.exe }}.sigstore.json"

      - name: Upload for the release
        uses: actions/upload-artifact@v6
        with:
          name: pdf-stamp-${{ matrix.slug }}
          path: |
            pdf-stamp-${{ matrix.slug }}${{ matrix.exe }}
            pdf-stamp-${{ matrix.slug }}${{ matrix.exe }}.sha256
            pdf-stamp-${{ matrix.slug }}${{ matrix.exe }}.sigstore.json
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────
  # Only once every platform has built: crates.io first, since a version
  # published there cannot be taken back and a GitHub release can be
  # edited, and the release last, all of it at once, so `releases/latest`
  # never holds one with a platform missing.
  # ────────────────────────────────────────────────────────────────────
  publish:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-latest
    # As crates.io's trusted publishing guide recommends: an environment
    # the trusted publisher can name, and that the repository's settings
    # can limit to main or put behind a reviewer.
    environment: release
    permissions:
      contents: write # the release, and the tag it creates
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Outside the checkout, which is the crate: cargo publish counts an
      # untracked file there as an uncommitted change and refuses.
      - uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      - name: What the release holds
        run: ls -l "$RUNNER_TEMP/dist"

      # A run that published the crate and then failed can be re-run
      # without publishing it twice, which crates.io would refuse.
      - name: Is this version on crates.io?
        id: crates-io
        run: python3 -I .github/scripts/release_version.py --on-crates-io .

      # A token for this job only, issued against the trusted publisher
      # set up in the crate's settings on crates.io, and revoked after.
      - name: Authenticate to crates.io
        id: auth
        if: steps.crates-io.outputs.published == 'false'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: steps.crates-io.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

      - name: Create the release, and its tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ${{ runner.temp }}/dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ needs.version.outputs.prerelease }}
